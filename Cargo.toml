[package]
name = "thintensor"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "ThinTensor model archive and planning core"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/random-unknown-username/Thintensor"
keywords = ["machine-learning", "inference", "llm", "gpu", "quantization"]
categories = ["command-line-utilities", "science"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "src/**/*.rs",
]

[[bin]]
name = "thintensor-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
blake3 = "1"
byteorder = "1"
hex = "0.4"
walkdir = "2"
safetensors = "0.6"
memmap2 = "0.9"
glob = "0.3"
fs2 = "0.4"
